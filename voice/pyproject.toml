[project]
name = "pyvex-voice-worker"
version = "0.1.0"
description = "Real-time voice worker for Pyvex Voice."
requires-python = ">=3.11"

# Pinned exactly. The pipeline is written against the signatures this release
# publishes, and Pipecat's service constructors change across minor versions.
dependencies = [
  "pipecat-ai[google,elevenlabs,silero,webrtc,runner]==1.10.0",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
# Separated so ordinary CI needs neither a socket nor a paid credential.
markers = [
  "integration: exercises real sockets; needs no provider credentials",
  "provider_live: calls a paid provider; needs real credentials",
]
addopts = "-m 'not integration and not provider_live'"
