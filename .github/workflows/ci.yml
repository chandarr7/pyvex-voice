name: ci

on:
  # Every branch, so a push is checked before it becomes a pull request. This
  # also avoids naming the default branch, which is not "main" here.
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build client and server bundles
        run: npm run build

  voice:
    name: Voice worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: voice
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      # No provider credentials: the suite covers assembly, configuration and
      # per-session isolation, which need none.
      - name: Test
        working-directory: voice
        run: .venv/bin/python -m pytest -q

      # Real sockets, still no credentials: a genuine aiortc peer negotiates
      # against the worker and must reach a connected peer connection.
      - name: Integration (real WebRTC negotiation)
        working-directory: voice
        run: .venv/bin/python -m pytest -q -m integration
